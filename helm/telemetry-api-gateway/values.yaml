replicaCount: 1

image:
  # Default: local/Docker Hub name after `docker build -t telemetry-api-gateway .` and `kind load docker-image ...`
  repository: docker.io/library/telemetry-api-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: telemetry-api-gateway

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080
httpAddr: 0.0.0.0:8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

database:
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  createSecret: true
  url: postgres://telemetry:telemetry@telemetry-db-postgres:5432/telemetry?sslmode=disable

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
  hosts:
    - host: telemetry-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
