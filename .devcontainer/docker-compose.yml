# API gateway dev container only.
#
# Postgres runs in a *separate* container (another compose stack). That stack typically publishes
# 5433:5432 on the host, so from this container reach it via host.docker.internal:5433 — not `db`
# (that hostname only exists on the DB stack’s network). To use hostname `db`, attach both stacks
# to the same external Docker network and set DATABASE_URL to postgres://telemetry:telemetry@db:5432/telemetry?sslmode=disable
#
# Credentials match the telemetry DB stack (user/db telemetry).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: ${DATABASE_URL:-postgres://telemetry:telemetry@host.docker.internal:5433/telemetry?sslmode=disable}
      PGPORT: "5433"
      PGHOST: host.docker.internal
      PGUSER: telemetry
      PGPASSWORD: telemetry
      PGDATABASE: telemetry
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - dev

networks:
  dev:
    driver: bridge
